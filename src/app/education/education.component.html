<div class="container">
  <div class="section-header fade-in">
    <h2>Academic <span class="text-gradient">Foundation</span></h2>
  </div>

  <div class="edu-grid">
    <div class="edu-card glass-card fade-in" (click)="toggleDetails()" tabindex="0" (keydown.enter)="toggleDetails()">
      <div class="edu-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
          <path d="M6 12v5c3 3 9 3 12 0v-5" />
        </svg>
      </div>
      <div class="edu-content">
        <h3 class="edu-school">Texas Tech University</h3>
        <p class="edu-degree">Masters in Computer Science</p>
        <div class="edu-meta">
          <span>Lubbock, Texas</span>
          <span class="dot">•</span>
          <span>2022 - 2024</span>
        </div>
        
        <button class="edu-btn" aria-label="Toggle coursework details">
          {{ showDetails ? 'Hide Coursework' : 'View Key Coursework' }}
          <span class="arrow" [class.rotated]="showDetails">↓</span>
        </button>

        <div *ngIf="showDetails" class="edu-details fade-in">
          <div class="course-grid">
            <span *ngFor="let course of courses" class="course-tag">{{ course }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
