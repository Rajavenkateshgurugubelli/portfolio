<div class="container">
  <div class="section-header fade-in">
    <h2>Certified <span class="text-gradient">Expertise</span></h2>
    <p class="section-subtitle">Click on a certification card to view verified competencies.</p>
  </div>

  <div class="cert-grid">
    <div *ngFor="let cert of certifications" 
         class="cert-card-wrapper fade-in" 
         (click)="toggleFlip(cert)"
         tabindex="0"
         (keydown.enter)="toggleFlip(cert)">
      <div class="cert-card-inner" [class.flipped]="cert.flipped">
        
        <!-- Front Side -->
        <div class="cert-card-front glass-card">
          <div class="cert-icon-wrapper">
            <img *ngIf="cert.icon" [src]="cert.icon" [alt]="cert.issuer" class="cert-icon">
            <span *ngIf="!cert.icon" class="text-icon">{{ cert.title.charAt(0) }}</span>
          </div>
          <div class="cert-content">
            <h3>{{ cert.issuer }}</h3>
            <p>{{ cert.title }}</p>
          </div>
          <div class="cert-hint">Click to flip 🔄</div>
        </div>

        <!-- Back Side -->
        <div class="cert-card-back glass-card">
          <h4 class="back-title">Verified Competencies</h4>
          <p class="cert-back-desc">{{ cert.description }}</p>
          <div class="cert-skills-list">
            <span *ngFor="let skill of cert.skills" class="cert-skill-tag">{{ skill }}</span>
          </div>
          <div class="cert-hint">Click to flip 🔄</div>
        </div>

      </div>
    </div>
  </div>
</div>
